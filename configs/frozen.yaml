# Frozen at the pre-registration commit. Chosen on the pilot split only (docs/PILOT.md).
N_main: 10
real_datasets: {so100: 12, koch: 12}   # N_real = round(10 * 30 / 25)
router: {alpha: 3.0, router_norm: true, identity_init: true}
lr: {learned: 1.0e-3, fixed: 3.0e-4, random: 1.0e-3, velocity: 1.0e-3, entropy: 3.0e-4, flat: 3.0e-4, proxy: 3.0e-3}
train: {batch: 64, weight_decay: 0.01, warmup_steps: 200, device: cpu}
budget:
  sim: {max_epochs: 200, patience: 20, max_minutes: 30}
  flat: {max_epochs: 200, patience: 20, max_minutes: 45}
  real: {max_epochs: 2000, patience: 100, max_minutes: 30}
  partb: {max_epochs: 800, patience: 50, max_minutes: 30}
exploratory:
  refractory_steps: 3
